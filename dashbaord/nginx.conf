server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS in front of this; nothing here needs to know the host
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite puts content-hashed bundles in /assets: a new build gets new names,
    # so these can be cached for a year
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html names the current bundles, so it must always be revalidated
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: react-router owns every other path
    location / {
        try_files $uri $uri/ /index.html;
    }
}
