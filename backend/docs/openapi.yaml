openapi: 3.0.3
info:
  title: ECOMPOS backend API
  version: "phase1-generated"
  description: >-
    Generated from the route source by tests/scripts/generateInventory.js.
    Every response uses SuccessEnvelope (2xx) or ErrorEnvelope (4xx/5xx);
    tests/contract/envelope.test.js checks every route against them.
servers:
  - url: /api/v1
components:
  securitySchemes:
    staffBearer: { type: http, scheme: bearer, bearerFormat: JWT, description: "aud=staff, carries sub/tid/tv" }
    shopperBearer: { type: http, scheme: bearer, bearerFormat: JWT, description: "aud=shopper" }
    platformBearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Tenant: { name: x-tenant, in: header, required: false, schema: { type: string }, description: "store slug; required in strict tenancy for tenant routes" }
  schemas:
    SuccessEnvelope:
      type: object
      required: [status, statusCode, message]
      properties:
        status: { type: string, enum: [OK] }
        statusCode: { type: integer, minimum: 200, maximum: 299 }
        message: { type: string }
        data: {}
    ErrorEnvelope:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer, minimum: 400, maximum: 599 }
        message: { type: string }
        code: { type: string, description: "machine-readable, e.g. TENANT_CONTEXT_REQUIRED" }
  responses:
    Success: { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SuccessEnvelope" } } } }
    Error: { description: Error, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
